outputs:
  default:
    type: elasticsearch
    hosts:
      - http://localhost:9200

inputs:
  - type: system/metrics
    id: local-system-metrics
    data_stream.namespace: default
    use_output: default

    streams:
      - metricsets:
          - cpu
        data_stream.dataset: system.cpu

      - metricsets:
          - memory
        data_stream.dataset: system.memory

      - metricsets:
          - network
        data_stream.dataset: system.network

      - metricsets:
          - filesystem
        data_stream.dataset: system.filesystem